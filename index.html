            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        h1 {

            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 30px;
            text-align: center;
        }

        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 18px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
        }

        .link-btn:hover {
            transform: translateY(-2px);
            background-color: var(--hover-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-content svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .section-header {
            width: 100%;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 20px 0 8px 10px;
